[project]
name = "maasermart"
version = "0.1.0"
description = "MaaserMart: charity discovery for maaser giving."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "django>=5.2,<5.3",
    "django-environ>=0.12",
    "psycopg[binary]>=3.2",
    "celery[sqs]>=5.5",
    "concurrent-log-handler>=0.9",
    "gunicorn>=23",
    "boto3>=1.44.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.9",
    "factory-boy>=3.3",
    "faker>=30",
    "ruff>=0.8",
    "pytest-cov>=7.1.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "S608", "S610", "S611"]
# S608/S610/S611: SQL built from strings, QuerySet.extra() and RawSQL (D-YOSEF-sql-params).
# DJ001: the data dictionary (§5.2) marks several string columns nullable; we follow it.
# DJ008: __str__ on every model is optional.
ignore = ["DJ001", "DJ008"]

[tool.pytest.ini_options]
# Coverage is measured on every run so the number is not a CI-only mystery
# (audit T1); the gate is `[tool.coverage.report] fail_under` below.
addopts = "--ds=config.settings.test --cov=apps --cov=config --cov-report=term-missing:skip-covered"
testpaths = ["tests"]

[tool.coverage.run]
source = ["apps", "config"]
omit = ["*/migrations/*"]

[tool.coverage.report]
# Below this, a change is leaving behaviour unexercised somewhere (audit T1).
fail_under = 85
skip_covered = true
