[project]
name = "maasermart"
version = "0.1.0"
description = "MaaserMart: charity discovery for maaser giving."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "django>=5.2,<5.3",
    "django-environ>=0.12",
    "psycopg[binary]>=3.2",
    "celery[sqs]>=5.5",
    "django-auditlog>=3.1",
    "concurrent-log-handler>=0.9",
    "gunicorn>=23",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.9",
    "factory-boy>=3.3",
    "faker>=30",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
