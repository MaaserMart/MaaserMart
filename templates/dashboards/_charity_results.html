{% if results %}
  <ul class="charity-list">
    {% for charity in results %}
      <li><a class="charity-card auth__choice" href="{% url 'dashboards:rabbi_haskama' charity.id %}">{{ charity.name }}</a></li>
    {% endfor %}
  </ul>
{% elif term %}
  <p class="empty">No charity matches "{{ term }}".</p>
{% endif %}
