{% extends "base.html" %}
{% block title %}Log in · MaaserMart{% endblock %}
{% block content %}
<h1>Log in</h1>
{% if error %}<p role="alert">{{ error }}</p>{% endif %}
<form method="post" action="{% url 'accounts:login' %}">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ next }}">
  <p><label>Username <input name="username" value="{{ username }}" required autofocus autocomplete="username"></label></p>
  <p><label>Password <input type="password" name="password" required autocomplete="current-password"></label></p>
  <p><button type="submit">Log in</button></p>
</form>
{% endblock %}
