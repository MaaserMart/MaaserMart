{% comment %}
A password box with an eye button that shows or hides what was typed.
Without JavaScript the button stays hidden and the box stays a password box.
Use: {% include "accounts/_password_input.html" with autocomplete="new-password" %}
{% endcomment %}
<span class="password" x-data="{ shown: false }">
  <input class="auth__input password__input" :type="shown ? 'text' : 'password'" type="password" name="password" required autocomplete="{{ autocomplete }}">
  <button class="password__toggle" type="button" hidden x-bind:hidden="false"
          @click="shown = !shown; $nextTick(() => $el.previousElementSibling.focus())"
          :aria-pressed="shown.toString()" :aria-label="shown ? 'Hide password' : 'Show password'" aria-label="Show password">
    <svg x-show="!shown" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
    <svg x-show="shown" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 19c-7 0-11-7-11-7a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
  </button>
</span>
