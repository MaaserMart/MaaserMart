name: Mirror main to Shaul

on:
  push:
    branches: [main]

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0              # get full history, not just the latest commit
          persist-credentials: false  # otherwise it pushes with the wrong login
      - run: git push --force https://x-access-token:${{ secrets.MIRROR_TOKEN }}@github.com/sykhayyat/MaaserMart.git HEAD:main
